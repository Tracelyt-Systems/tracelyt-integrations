name: Bug Report
description: Report an issue, broken documentation link, or configuration error
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in `tracelyt-integrations`. Please provide detailed information to help reproduce and resolve it.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the problem or broken link.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to observe the issue.
      placeholder: |
        1. Open file 'docs/...'
        2. Click link '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
